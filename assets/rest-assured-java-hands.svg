<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Hands-on Rest Assured and Java API automation</title>
  <desc id="desc">Two hands typing on a laptop with API testing and Java code on the screen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset="1" stop-color="#d9f1ec"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10375d"/>
      <stop offset="1" stop-color="#0878cf"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c3a4"/>
      <stop offset="1" stop-color="#c97858"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10375d" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="650" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="130" fill="#fff" opacity=".42"/>
  <circle cx="120" cy="560" r="170" fill="#0a807c" opacity=".08"/>

  <g filter="url(#shadow)">
    <rect x="268" y="92" width="664" height="382" rx="24" fill="#163b5e"/>
    <rect x="292" y="116" width="616" height="334" rx="12" fill="url(#screen)"/>
    <circle cx="320" cy="142" r="6" fill="#ed6b2f"/>
    <circle cx="342" cy="142" r="6" fill="#ffd166"/>
    <circle cx="364" cy="142" r="6" fill="#70d6b4"/>
    <text x="334" y="205" fill="#9ee6df" font-family="Consolas, monospace" font-size="25">@Test</text>
    <text x="334" y="242" fill="#fff" font-family="Consolas, monospace" font-size="24">given().baseUri(url)</text>
    <text x="334" y="279" fill="#ffd166" font-family="Consolas, monospace" font-size="24">.when().get("/users")</text>
    <text x="334" y="316" fill="#fff" font-family="Consolas, monospace" font-size="24">.then().statusCode(200);</text>
    <rect x="334" y="352" width="178" height="42" rx="21" fill="#0a807c"/>
    <text x="423" y="380" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">JAVA + API</text>
    <path d="M220 474h760l-78 42H298z" fill="#b9cbd6"/>
    <path d="M220 474h760l-32 17H252z" fill="#f8fcff"/>
    <rect x="488" y="486" width="224" height="13" rx="6" fill="#7e9bad"/>
  </g>

  <g fill="#d8e7ed" stroke="#8aa9b8" stroke-width="2">
    <rect x="296" y="510" width="608" height="70" rx="13"/>
    <path d="M327 528h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zM353 553h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42zm52 0h42v18h-42z"/>
  </g>

  <g fill="url(#skin)" stroke="#a85e48" stroke-width="3" stroke-linejoin="round">
    <path d="M126 600c12-61 45-104 90-134l83-57c18-12 41-8 53 8 9 13 7 31-5 42l-73 61 115-64c16-9 36-4 45 11 8 14 4 32-10 42l-111 78c-31 22-56 48-75 79z"/>
    <path d="M1074 600c-12-61-45-104-90-134l-83-57c-18-12-41-8-53 8-9 13-7 31 5 42l73 61-115-64c-16-9-36-4-45 11-8 14-4 32 10 42l111 78c31 22 56 48 75 79z"/>
    <path d="M343 465l63-55c12-10 29-8 38 5 8 11 6 27-4 37l-53 52z"/>
    <path d="M857 465l-63-55c-12-10-29-8-38 5-8 11-6 27 4 37l53 52z"/>
  </g>

  <g fill="#fff" opacity=".8" font-family="Segoe UI, sans-serif">
    <text x="80" y="92" font-size="24" font-weight="700">HANDS-ON AUTOMATION</text>
    <text x="80" y="124" font-size="18">Build, test, report</text>
  </g>
</svg>